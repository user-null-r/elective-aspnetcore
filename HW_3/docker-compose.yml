services:
  postgres:
    image: postgres:17
    container_name: elective-aspnetcore-postgres
    environment:
      POSTGRES_DB: elective_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: homework_password
    ports:
      - "5432:5432"
    volumes:
      - elective-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elective_users"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elective-postgres-data:
